[project]
name = "local-llm-werewolf"
version = "0.1.0"
description = "A turn-based werewolf game for local language models"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8.0"]
benchmark = ["psutil>=5.9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
